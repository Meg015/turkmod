# Include this file inside the HTTPS VirtualHost for the application domain.
# Required modules: proxy, proxy_http, proxy_wstunnel, headers, ssl.
#
# Example:
#   Include /home/siteler/web/turkmod.net/public_html/deployment/apache/mod-portal-websocket.conf

ProxyRequests Off
ProxyPreserveHost On

# The public client connects to wss://your-domain/ws. Ratchet remains private
# on 127.0.0.1:8080 and Apache performs TLS termination and WebSocket upgrade.
ProxyPass        /ws  ws://127.0.0.1:8080/ connectiontimeout=5 timeout=65
ProxyPassReverse /ws  ws://127.0.0.1:8080/

<Location /ws>
    Require all granted
    Header always set Cache-Control "no-store"
</Location>
